name: Release

# Build prebuilt binaries when you push a version tag, e.g. `git tag v0.3.0`.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          bin=target/${{ matrix.target }}/release/casual
          tar -czf casual-${{ matrix.target }}.tar.gz -C "$(dirname "$bin")" casual

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: casual-${{ matrix.target }}
          path: casual-${{ matrix.target }}.tar.gz

  release:
    name: attach to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

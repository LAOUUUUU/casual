[package]
name = "casual"
version = "0.4.0"
edition = "2024"
description = "A modular, plugin-driven CLI toolkit: network diagnostics, logging proxy, file scanner, dynamic/WASM plugins, and live ML visualizations. Built for learning."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1"
indicatif = "0.18"
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

# --- optional, feature-gated. The default build stays lean. ---
# intercept: decrypt your own HTTPS (your-own-CA, mitmproxy-style).
rcgen = { version = "0.13", optional = true, features = ["x509-parser"] }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
# net: tls/probe/replay client commands (share rustls with intercept).
x509-parser = { version = "0.16", optional = true }
# tui: the live ratatui dashboard.
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
# wasm: run sandboxed WebAssembly plugins.
wasmtime = { version = "27", optional = true, default-features = false, features = ["cranelift", "runtime"] }

[features]
default = []
intercept = ["dep:rcgen", "dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
net = ["dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots", "dep:x509-parser"]
tui = ["dep:ratatui", "dep:crossterm"]
wasm = ["dep:wasmtime"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
